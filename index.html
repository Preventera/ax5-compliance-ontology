<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OntoX5 — Ontologie de conformité SST multi-juridictionnelle | AgenticX5</title>
<meta name="description" content="Un modèle de conformité qui refuse de fusionner les définitions juridictionnelles. Trois domaines générés par un seul moteur, cent questions terrain, et les limites écrites noir sur blanc.">
<link rel="icon" href="logo-agenticx5.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==== OntoX5 — portail vitrine ========================================
   Jetons repris de ax5-explorer/index.html : le portail et l'explorateur
   se lisent comme un seul produit.
   Soumis a la meme doctrine de rendu (.claude/skills/ontox5-rendu) :
   aucun verdict de conformite, aucun etat porte par la couleur seule,
   provenance visible, parite FR/EN stricte, survit au noir et blanc.
   ===================================================================== */

:root{
  --paper:#EDECE6; --raised:#F7F6F2; --sunk:#E4E3DC;
  --rule:#D3D2C9; --rule2:#BCBAAF;
  --ink:#1B1E24; --muted:#4E535B; --dim:#7C8189;
  --cover:#191024; --cover-ink:#EDE9F5; --cover-dim:#9B8FB2;
  --violet:#5E3FA6; --violet-soft:#EDE7F8;
  --oxide:#9E3527; --oxide-soft:#F6E4E1;
  --ochre:#96660A; --ochre-soft:#F7EDD8;
  --verdigris:#2A6250; --verdigris-soft:#E2EFE9;
  --seal:#1F4E79;
  --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  --serif:'Spectral',Georgia,serif; --data:'JetBrains Mono',monospace;
  --measure:64ch;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--seal)}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--violet);color:#fff;
  padding:10px 16px;z-index:100}
.skip:focus{left:0}

.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
.prose{max-width:var(--measure)}
.prose p{font-family:var(--serif);font-size:18px;line-height:1.68;margin-bottom:16px}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:500}

/* ---------- barre de tete ---------- */
.top{background:var(--cover);color:var(--cover-ink);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.home{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.home img{width:34px;height:34px;border-radius:7px;display:block}
.wordmark{font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:-.01em;
  color:var(--cover-ink);white-space:nowrap}
.wordmark b{font-weight:600;color:#B18CF0}
.wordmark span{color:var(--cover-dim);font-weight:400}
.topnav{margin-left:auto;display:flex;gap:18px;align-items:center}
.topnav a{color:var(--cover-dim);font-size:14px;text-decoration:none;white-space:nowrap}
.topnav a:hover{color:var(--cover-ink)}
.topnav .live{color:var(--cover-ink);border:1px solid #3B2C55;border-radius:3px;
  padding:6px 13px;font-family:var(--data);font-size:12.5px}
.topnav .live:hover{border-color:#B18CF0}
.lang{display:flex;border:1px solid #3B2C55;border-radius:3px;overflow:hidden;flex-shrink:0}
.lang button{background:none;border:0;color:var(--cover-dim);font-family:var(--data);
  font-size:12px;padding:6px 11px;cursor:pointer}
.lang button[aria-pressed=true]{background:#B18CF0;color:var(--cover);font-weight:500}
@media(max-width:860px){.topnav a:not(.live){display:none}}
@media(max-width:520px){.wordmark span{display:none}.topnav .live{display:none}}

/* ---------- heros : le conflit de seuil ---------- */
.hero{padding:74px 0 64px;border-bottom:1px solid var(--rule2)}
.hero .kicker{font-family:var(--data);font-size:12.5px;color:var(--dim);margin-bottom:26px}
.hero h1{font-family:var(--display);font-weight:500;letter-spacing:-.025em;
  font-size:clamp(30px,5.2vw,56px);line-height:1.06;max-width:15ch}
.hero .sub{font-family:var(--serif);font-size:19px;line-height:1.62;color:var(--muted);
  max-width:58ch;margin-top:20px}

.split{margin-top:44px;border-top:1px solid var(--rule2)}
.split .term{font-family:var(--display);font-size:clamp(21px,3vw,29px);font-weight:500;
  letter-spacing:-.015em;padding:18px 0 4px}
.split .termnote{font-family:var(--data);font-size:12.5px;color:var(--dim);padding-bottom:20px}
.cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.col{padding:24px 26px 26px;background:var(--raised);border-right:1px solid var(--rule)}
.col:last-child{border-right:0;background:var(--sunk)}
.col .reg{font-family:var(--data);font-size:12.5px;color:var(--seal);margin-bottom:14px}
.col .num{font-family:var(--display);font-size:58px;font-weight:500;line-height:1;
  letter-spacing:-.04em;color:var(--ink)}
.col .unit{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--muted);
  margin-top:10px;max-width:26ch}
.col .cite{font-family:var(--data);font-size:11.5px;color:var(--dim);margin-top:16px;
  padding-top:12px;border-top:1px solid var(--rule)}
.verdict{border-top:1px solid var(--rule2);padding:22px 0 0;font-family:var(--serif);
  font-size:18px;line-height:1.6;max-width:62ch}
@media(max-width:680px){
  .cols{grid-template-columns:1fr}
  .col{border-right:0;border-bottom:1px solid var(--rule)}
  .col .num{font-size:46px}
}

/* ---------- sections ---------- */
section{padding:62px 0;border-bottom:1px solid var(--rule)}
.depth{font-family:var(--data);font-size:12px;color:var(--dim);margin-bottom:12px}
h2{font-family:var(--display);font-size:clamp(23px,3.2vw,32px);font-weight:500;
  letter-spacing:-.022em;line-height:1.16;max-width:20ch;margin-bottom:18px}
h3{font-family:var(--display);font-size:18px;font-weight:500;letter-spacing:-.015em;
  margin-bottom:8px}
.lede{font-family:var(--serif);font-size:19px;line-height:1.6;color:var(--muted);
  max-width:60ch;margin-bottom:26px}

.rule-box{background:var(--cover);color:var(--cover-ink);padding:34px 32px;margin:32px 0}
.rule-box p{font-family:var(--serif);font-size:21px;line-height:1.5;max-width:46ch;margin:0}
.rule-box .why{font-family:var(--body);font-size:15px;line-height:1.6;color:var(--cover-dim);
  max-width:56ch;margin-top:18px}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}
.cbox{border:1px solid var(--rule);background:var(--raised);padding:22px}
.cbox.on{border-color:var(--violet);background:var(--violet-soft)}
.cbox .lab{font-family:var(--data);font-size:11.5px;color:var(--dim);margin-bottom:14px}
.cbox.on .lab{color:var(--violet)}
.cbox ul{list-style:none;font-family:var(--data);font-size:13px;line-height:2;color:var(--muted)}
.cbox li::before{content:"\2014";margin-right:.55em;color:var(--rule2)}
.cbox.on li::before{content:"\2713";color:var(--violet)}
@media(max-width:680px){.compare{grid-template-columns:1fr}}

/* ---------- tableau des domaines ---------- */
.tbl{width:100%;border-collapse:collapse;margin-top:26px;font-size:14.5px}
.tbl caption{text-align:left;font-family:var(--data);font-size:12px;color:var(--dim);
  padding-bottom:12px}
.tbl th,.tbl td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--rule)}
.tbl thead th{font-family:var(--display);font-size:14px;font-weight:500;
  border-bottom:1px solid var(--rule2)}
.tbl thead th:first-child{font-family:var(--body);font-weight:400;color:var(--dim);font-size:13px}
.tbl td{font-family:var(--data);font-size:13.5px}
.tbl td:first-child{font-family:var(--body);font-size:14.5px;color:var(--muted)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.flag td{background:var(--ochre-soft)}
.tbl tr.flag td:first-child{color:var(--ink)}
.aside{border-left:3px solid var(--ochre);background:var(--ochre-soft);
  padding:20px 22px;margin-top:24px;max-width:var(--measure)}
.aside p{font-family:var(--serif);font-size:17px;line-height:1.6;margin-bottom:12px}
.aside p:last-child{margin-bottom:0}

/* ---------- statuts ---------- */
.statuses{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;margin-top:28px}
.st{border:1px solid var(--rule);background:var(--raised);padding:18px 19px}
.st .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--data);
  font-size:11.5px;padding:3px 9px;border-radius:3px;font-weight:500;margin-bottom:12px}
.st.demo{border-left:3px solid var(--verdigris)}
.st.demo .pill{border:1px solid var(--verdigris);color:var(--verdigris);background:var(--verdigris-soft)}
.st.demo .pill::before{content:"\25CF"}
.st.struct{border-left:3px solid var(--seal)}
.st.struct .pill{border:1px solid var(--seal);color:var(--seal);background:#E3ECF4}
.st.struct .pill::before{content:"\25D0"}
.st.extra{border-left:3px solid var(--ochre)}
.st.extra .pill{border:1px solid var(--ochre);color:var(--ochre);background:var(--ochre-soft)}
.st.extra .pill::before{content:"\25CB"}
.st.absent{border-left:3px solid var(--oxide);background:var(--oxide-soft)}
.st.absent .pill{border:1px solid var(--oxide);color:var(--oxide);background:var(--raised)}
.st.absent .pill::before{content:"\2717"}
.st p{font-size:14.5px;line-height:1.55;color:var(--muted)}

/* ---------- les sept angles ---------- */
.angles{margin-top:26px;border-top:1px solid var(--rule2)}
.angle{display:grid;grid-template-columns:158px minmax(0,1fr) 122px;gap:18px;
  padding:14px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.angle .nom{font-family:var(--display);font-size:16px;font-weight:500}
.angle .q{font-family:var(--serif);font-size:16.5px;color:var(--muted)}
.angle .etat{font-family:var(--data);font-size:12px;text-align:right;white-space:nowrap}
.angle .etat::before{margin-right:.5em}
.angle.ok .etat{color:var(--verdigris)} .angle.ok .etat::before{content:"\25CF"}
.angle.part .etat{color:var(--ochre)}   .angle.part .etat::before{content:"\25D0"}
.angle.non .etat{color:var(--oxide)}    .angle.non .etat::before{content:"\25CB"}
.angle.non .nom{color:var(--oxide)}
@media(max-width:680px){
  .angle{grid-template-columns:1fr auto;gap:6px 14px}
  .angle .q{grid-column:1 / -1}
}

/* ---------- demonstration ---------- */
.demo-band{background:var(--sunk);border-top:1px solid var(--rule2);
  border-bottom:1px solid var(--rule2)}
.demo-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:start}
@media(max-width:820px){.demo-grid{grid-template-columns:1fr;gap:28px}}
.btn{display:inline-block;font-family:var(--data);font-size:14px;text-decoration:none;
  padding:13px 22px;border-radius:3px;background:var(--ink);color:var(--paper);
  border:1px solid var(--ink)}
.btn:hover{background:var(--violet);border-color:var(--violet)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule2)}
.btn.ghost:hover{background:var(--raised);border-color:var(--seal);color:var(--ink)}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.spec{font-family:var(--data);font-size:13px;line-height:2.1;color:var(--muted);
  border-left:1px solid var(--rule2);padding-left:20px}
.spec b{color:var(--ink);font-weight:500}

/* ---------- portes de sortie ---------- */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
  border-top:1px solid var(--rule2)}
.door{padding:26px 24px 28px;border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);display:block}
.door:last-child{border-right:0}
.door:hover{background:var(--raised)}
.door h3{margin-bottom:6px}
.door p{font-size:14.5px;line-height:1.55;color:var(--muted)}
.door .go{font-family:var(--data);font-size:12.5px;color:var(--seal);margin-top:14px;display:block}
@media(max-width:760px){.door{border-right:0}}

/* ---------- ecosysteme ---------- */
.eco{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
.eco-item{border:1px solid var(--rule);background:var(--raised);padding:22px 23px}
.eco-item .role{font-family:var(--data);font-size:11.5px;color:var(--dim);margin-bottom:10px}
.eco-item p{font-size:14.5px;line-height:1.6;color:var(--muted);margin-top:8px}
.eco-item a{font-family:var(--data);font-size:13px;display:inline-block;margin-top:14px}
@media(max-width:680px){.eco{grid-template-columns:1fr}}

/* ---------- pied ---------- */
footer{background:var(--cover);color:var(--cover-dim);padding:44px 0 52px;
  font-size:14px;line-height:1.85}
footer a{color:var(--cover-ink)}
footer .frow{display:flex;gap:34px;flex-wrap:wrap;justify-content:space-between}
footer .fbrand{display:flex;align-items:flex-start;gap:14px}
footer .fbrand img{width:44px;height:44px;border-radius:9px;flex-shrink:0}
footer .prov{font-family:var(--data);font-size:11.5px;color:#6E6188;margin-top:26px;
  padding-top:18px;border-top:1px solid #2C2140}

/* ---------- mouvement et impression ---------- */
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

@media print{
  :root{--ink:#000;--muted:#222;--dim:#444;--paper:#fff;--raised:#fff;--sunk:#fff;
        --rule:#999;--rule2:#000;--cover:#fff;--cover-ink:#000;--cover-dim:#333}
  body{font-size:10.5pt}
  @page{margin:16mm}
  .top,.btnrow,.skip,.lang{display:none}
  .rule-box{border:1.5pt solid #000}
  .col,.cbox,.st,.eco-item,.door{border:1pt solid #000}
  section{break-inside:avoid}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:8pt;word-break:break-all}
}
</style>
</head>

};

let lang = "fr";
const t = k => T[lang][k];
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.title = TITLES[l];
  bFr.setAttribute("aria-pressed", l === "fr");
  bEn.setAttribute("aria-pressed", l === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  render();
}

function render(){
  uTrait.innerHTML = t("trait").map(x => `<li>${esc(x)}</li>`).join("");
  uFiche.innerHTML = t("fiche").map(x => `<li>${esc(x)}</li>`).join("");

  const dec = lang === "fr" ? "," : ".";
  tDom.innerHTML =
    `<caption>${esc(t("capDom"))}</caption>` +
    `<thead><tr><th scope="col">${esc(t("colCrit"))}</th>` +
    `<th scope="col">${esc(t("colSst"))}</th>` +
    `<th scope="col">${esc(t("colScm"))}</th>` +
    `<th scope="col">${esc(t("colIa"))}</th></tr></thead><tbody>` +
    t("rows").map((nom, i) => {
      const last = i === DOM_ROWS.length - 1;
      const cells = DOM_ROWS[i]
        .map(v => `<td>${esc(String(v).replace(",", dec))}</td>`).join("");
      return `<tr${last ? ' class="flag"' : ""}><td>${esc(nom)}</td>${cells}</tr>`;
    }).join("") + `</tbody>`;

  sList.innerHTML = t("stats").map(([cls, nom, txt]) =>
    `<div class="st ${cls}"><span class="pill">${esc(nom)}</span><p>${esc(txt)}</p></div>`
  ).join("");

  spec.innerHTML = t("spec")
    .map(([n, lab]) => `<b>${esc(n)}</b> ${esc(lab)}`).join("<br>");

  aList.innerHTML = t("angles").map(([cls, nom, q, etat]) =>
    `<div class="angle ${cls}"><div class="nom">${esc(nom)}</div>` +
    `<div class="q">${esc(q)}</div><div class="etat">${esc(etat)}</div></div>`
  ).join("");

  dList.innerHTML = t("doors").map(([href, titre, txt, go]) =>
    `<a class="door" href="${href}"><h3>${esc(titre)}</h3><p>${esc(txt)}</p>` +
    `<span class="go">${esc(go)}</span></a>`
  ).join("");
}

/* La langue du navigateur decide de l'ouverture, sans jamais l'imposer :
