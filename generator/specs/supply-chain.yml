# =====================================================================
# SPEC DE DOMAINE — SÉMANTIQUE MULTI-SYSTÈMES, CHAÎNE D'APPROVISIONNEMENT
#
# Écrit par un planificateur, pas par un ontologue.
#
# ---------------------------------------------------------------------
# CE QUE CE FICHIER DÉMONTRE
#
# Le générateur n'a pas changé d'une ligne. Seul ce spec est nouveau.
# Le domaine passe de la conformité réglementaire à la planification
# de la chaîne d'approvisionnement, et le modèle tient tel quel :
#
#   Juridiction     ->  SystemeSource   (SAP, le WMS, Salesforce)
#   ConceptLocal    ->  ConceptSysteme  (« site » selon SAP)
#   Correspondance  ->  Rapprochement   (la fiche qui relie les deux)
#   Obligation      ->  RegleDePlanif   (avec source et dates)
#
# LA DÉCISION DE MODÉLISATION EST IDENTIQUE :
# on ne fusionne PAS « lead time » de SAP avec « lead time » du WMS
# dans un champ canonique unique. On garde chaque définition dans son
# système, et on modélise le RAPPORT entre elles — avec un niveau de
# confiance, une base et un auteur.
#
# Deux systèmes qui emploient le même mot pour des choses différentes,
# c'est le même problème qu'un agent de conformité qui confond
# l'espace clos du Québec avec celui d'OSHA. Fusionner produit une
# réponse fluide et fausse.
# =====================================================================

domaine:
  nom: "Sémantique multi-systèmes — chaîne d'approvisionnement"
  prefixe: "scm"
  uri: "https://agenticx5.com/ont/scm#"
  version: "0.1.0"

fiches:

  # -------------------------------------------------------------------
  - nom: SystemeSource
    description: >
      Un système qui détient de la donnée et impose ses propres
      définitions. SAP ECC, un WMS, Salesforce, un TMS. L'équivalent
      d'une juridiction : il a autorité sur le sens des termes à
      l'intérieur de son périmètre, et nulle part ailleurs.
    champs:
      - nom: nom
        libelle: "Nom du système"
        type: texte
        obligatoire: true
      - nom: code
        libelle: "Code court (SAP, WMS, SFDC)"
        type: texte
        obligatoire: true
      - nom: proprietaire
        libelle: "Équipe responsable"
        type: texte
        obligatoire: false
        # Utile pour router une question de sémantique vers un humain,
        # mais souvent inconnu au moment de l'inventaire. Pas de blocage.

  # -------------------------------------------------------------------
  - nom: ConceptSysteme
    description: >
      Un terme tel que défini par UN système. « Site » au sens de SAP
      est une fiche; « site » au sens du WMS en est une autre. Dans SAP
      un site peut être une entité de valorisation; dans le WMS c'est un
      bâtiment physique. Même mot, réalités différentes.
      On ne les fusionne jamais.
    champs:
      - nom: libelle
        libelle: "Terme employé"
        type: texte
        obligatoire: true
      - nom: scopedTo
        libelle: "Système qui le définit"
        type: lien
        vers: SystemeSource
        obligatoire: true
        unique: true
        # Un terme sans système n'a aucun sens exploitable : on ignore
        # d'où il vient, donc on ne peut ni le retourner, ni s'en servir
        # comme extrémité de rapprochement.
      - nom: definition
        libelle: "Définition dans ce système"
        type: texte
        obligatoire: true
      - nom: champTechnique
        libelle: "Champ physique (table.colonne)"
        type: texte
        obligatoire: false
        # Le pont vers l'implémentation. Absent tant que le concept
        # n'est pas encore rattaché à une source de données.

  # -------------------------------------------------------------------
  - nom: AncrageMetier
    description: >
      Le terme du langage commun. « Site », « délai
      d'approvisionnement », « capacité ». Sert de pivot pour retrouver
      les définitions de chaque système.
      AUCUNE AUTORITÉ : ce n'est pas une réponse, c'est une entrée
      d'index. La réponse est toujours dans un ConceptSysteme.
    champs:
      - nom: libelle
        libelle: "Terme métier"
        type: texte
        obligatoire: true
      - nom: definition
        libelle: "Sens général"
        type: texte
        obligatoire: true

  # -------------------------------------------------------------------
  - nom: Rapprochement
    description: >
      La fiche qu'un analyste écrit à la main pour dire « dans SAP on
      appelle ça ceci, dans le WMS on appelle ça cela, et voici à quel
      point c'est la même chose ». Elle a un auteur, une justification
      et un niveau de confiance.
      Ce n'est PAS un simple trait entre deux colonnes : un trait ne
      s'audite pas. Quand un chiffre de planification est contesté,
      c'est cette fiche qu'on ouvre.
    champs:
      - nom: source
        libelle: "Concept de départ"
        type: lien
        vers: ConceptSysteme
        obligatoire: true
        unique: true
      - nom: cible
        libelle: "Concept d'arrivée"
        type: lien
        vers: ConceptSysteme
        obligatoire: true
        unique: true
      - nom: ancrage
        libelle: "Terme métier commun"
        type: lien
        vers: AncrageMetier
        obligatoire: true
        unique: true
      - nom: mappingRelation
        libelle: "Degré d'équivalence"
        type: texte
        obligatoire: true
        unique: true
        # exactMatch / closeMatch / broadMatch / narrowMatch.
        # exactMatch autorise un agent à substituer l'un à l'autre
        # SANS avertir l'utilisateur. D'où le seuil, plus bas.
      - nom: confidence
        libelle: "Niveau de confiance (0 à 1)"
        type: decimal
        obligatoire: true
        unique: true
        min: 0.0
        max: 1.0
      - nom: basis
        libelle: "Sur quelle base"
        type: texte
        obligatoire: true
      - nom: wasAttributedTo
        libelle: "Qui l'affirme"
        type: texte
        obligatoire: true
      - nom: recordedAt
        libelle: "Saisi au système le"
        type: horodatage
        obligatoire: true
        unique: true

  # -------------------------------------------------------------------
  - nom: RegleDePlanif
    description: >
      Une règle de planification qui dépend d'une définition précise.
      « Le délai fournisseur inclut le transit » est vrai dans un
      système et faux dans un autre. La règle doit dire de quel système
      elle tient sa définition, sinon elle n'est pas interprétable.
    champs:
      - nom: enonce
        libelle: "Énoncé de la règle"
        type: texte
        obligatoire: true
      - nom: citation
        libelle: "Source (document, ticket, décision)"
        type: texte
        obligatoire: true
        # Même logique qu'une référence d'article en conformité : une
        # règle de planification sans source est incontestable et donc
        # inutilisable quand un chiffre est remis en question.
      - nom: statedIn
        libelle: "Système de référence"
        type: lien
        vers: SystemeSource
        obligatoire: true
        unique: true
      - nom: validFrom
        libelle: "En vigueur depuis"
        type: date
        obligatoire: true
        unique: true
      - nom: validTo
        libelle: "En vigueur jusqu'à"
        type: date
        obligatoire: false
      - nom: recordedAt
        libelle: "Saisi au système le"
        type: horodatage
        obligatoire: true
        unique: true
        # Bitemporalité. « Quelle règle était en vigueur au moment du
        # plan » et « que savions-nous quand nous l'avons produit »
        # sont deux questions différentes. Après un manquement de
        # service, c'est la seconde qui est posée.
      - nom: appliesToConcept
        libelle: "Concept concerné"
        type: lien
        vers: ConceptSysteme
        obligatoire: true
        # Certaines règles sont transversales et ne visent aucun concept
        # précis. Le générateur va décider quoi en faire.

# =====================================================================
# RÈGLES MÉTIER
#
# Ce que les champs obligatoires ne savent pas exprimer : des règles
# qui CROISENT plusieurs champs, ou qui traversent plusieurs fiches.
# Le générateur les traduit en SHACL-SPARQL.
# =====================================================================

regles:

  - nom: seuil_equivalence_exacte
    sur: Rapprochement
    type: condition_croisee
    libelle: >
      On ne déclare pas une équivalence exacte entre deux systèmes sur
      une preuve faible. exactMatch autorise un agent à substituer un
      champ à l'autre sans prévenir; sur une preuve faible, c'est ainsi
      qu'on produit un plan fluide et faux.
    si:
      champ: mappingRelation
      vaut: "exactMatch"
    alors:
      champ: confidence
      minimum: 0.95

  - nom: rapprochement_traverse_les_systemes
    sur: Rapprochement
    type: comparaison_traversee
    libelle: >
      Un rapprochement relie DEUX systèmes. Relier deux concepts du même
      système n'a aucun sens : il n'y a rien à traduire, et la fiche
      masque un problème de modélisation interne.
    compare:
      chemin_a: [source, scopedTo]
      chemin_b: [cible, scopedTo]
      doivent_etre: differents

  - nom: coherence_des_dates
    sur: RegleDePlanif
    type: condition_croisee
    libelle: >
      Une règle ne peut pas cesser d'être en vigueur avant d'y entrer.
    si:
      champ: validTo
      existe: true
    alors:
      champ: validTo
      superieur_a: validFrom
